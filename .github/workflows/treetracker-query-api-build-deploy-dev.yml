name: Service CI/CD Pipeline to Release and Deploy to Dev Env

on:
  push:
    branches:
      - main

env:
  project-directory: ./

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    if: |
      !contains(github.event.head_commit.message, 'skip-ci') &&
      github.event_name == 'push' &&
      github.repository == 'Greenstand/treetracker-query-api'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Use Node.js 22.14.0
        uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'

      - name: npm clean install
        run: npm ci
        working-directory: ${{ env.project-directory }}

      - run: npm i -g semantic-release @semantic-release/{git,exec,changelog}

      - name: Run semantic-release
        id: semantic-release
        run: semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - run: npm run build
        if: steps.semantic-release.outputs.new-release-published == 'true'
        working-directory: ${{ env.project-directory }}

      - run: npm prune --production
        if: steps.semantic-release.outputs.new-release-published == 'true'
        working-directory: ${{ env.project-directory }}

      - name: Set up QEMU
        if: steps.semantic-release.outputs.new-release-published == 'true'
        uses: docker/setup-qemu-action@v1

      - name: Set up Docker Buildx
        if: steps.semantic-release.outputs.new-release-published == 'true'
        uses: docker/setup-buildx-action@v1

      - name: Login to DockerHub
        if: steps.semantic-release.outputs.new-release-published == 'true'
        uses: docker/login-action@v1
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build snapshot and push on merge
        id: docker_build_release
        if: steps.semantic-release.outputs.new-release-published == 'true'
        uses: docker/build-push-action@v2
        with:
          context: ./
          file: ./Dockerfile
          push: true
          tags: greenstand/${{ github.event.repository.name }}:${{ steps.semantic-release.outputs.new-release-version }}

    outputs:
      new-release-published: ${{ steps.semantic-release.outputs.new-release-published }}
      new-release-version: ${{ steps.semantic-release.outputs.new-release-version }}
      new-release-git-tag: ${{ steps.semantic-release.outputs.new-release-git-tag }}

  deploy:
    name: Deploy to dev env
    runs-on: ubuntu-latest
    needs: release
    if: |
      needs.release.outputs.new-release-published == 'true' &&
      !contains(github.event.head_commit.message, 'skip-ci') &&
      github.event_name == 'push' &&
      github.repository == 'Greenstand/treetracker-query-api'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.new-release-git-tag }}
      - name: Install kustomize
        run: |
          KUSTOMIZE_VERSION=5.8.1
          curl -fsSL -o /tmp/kustomize.tar.gz \
            "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv${KUSTOMIZE_VERSION}/kustomize_v${KUSTOMIZE_VERSION}_linux_amd64.tar.gz"
          tar -xzf /tmp/kustomize.tar.gz -C /tmp
          sudo install -m 0755 /tmp/kustomize /usr/local/bin/kustomize
          kustomize version
      - name: Run kustomize
        env:
          IMAGE_NAME: greenstand/${{ github.event.repository.name }}
          IMAGE_TAG: ${{ needs.release.outputs.new-release-version }}
        run: |
          cd deployment/base
          kustomize edit set image "${IMAGE_NAME}:${IMAGE_TAG}"
      - name: Install doctl for kubernetes
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DEV_DIGITALOCEAN_TOKEN }}
      - name: Save DigitalOcean kubeconfig
        run: doctl kubernetes cluster kubeconfig save ${{ secrets.DEV_CLUSTER_NAME }}
      #- name: Delete completed migration jobs prior to deployment
      #  run: kubectl -n ${{ secrets.K8S_NAMESPACE }} delete job --ignore-not-found=true  database-migration-job
      - name: Update kubernetes resources
        run: kustomize build deployment/overlays/development | kubectl apply -n ${{ secrets.K8S_NAMESPACE }} --wait -f -
      #- name: Attempt to wait for migration job to complete
      #  run: kubectl wait -n ${{ secrets.K8S_NAMESPACE }} --for=condition=complete --timeout=45s job/database-migration-job
